services:
  api:
    build: ./api
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
    volumes:
      - api-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: ./web
    environment:
      - API_ORIGIN=http://api:8000
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  api-data:
  caddy-data:
